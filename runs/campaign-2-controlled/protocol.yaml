campaign: 2
name: controlled
harness: harness.py
summary: >
  The campaign the report draws on. Every condition below is held constant across
  all rows, and each query plan is captured in the same statistics state as the
  timings beside it.

protocol:
  repetitions: 5
  statistics: ANALYZE VERBOSE, once per configuration, before any query runs
  query_order: sorted          # lexicographic, identical in every configuration
  connections: one per repetition, closed immediately afterwards
  reported_statistic: median of the repetitions; mean and per-repetition times recorded
  per_repetition_times: recorded, with timeouts marked
  timeout:
    sf_0.1_to_30: 600000       # ms
  plans:
    captured: per query, before its repetitions
    kind: estimate-only, EXPLAIN without ANALYZE, so it does not execute the query
    statistics_state: identical to the timings, verified by a fingerprint taken
      before and after the run

coverage:
  versions: [beta 1, beta 2, beta 3]
  approaches:
    sql_pgq: all three versions
    relational: beta 3 only
  scale_factors: [0.1, 0.3, 1, 3, 10, 30]
  sf_100: not measured; see campaign 1

instances:                     # constant across every scale factor measured
  all: {flavour: 8cpu-32ram, vcpu: 8, ram_gib: 32}

contents:
  results: "{version}/{approach}/{strategy}-sf{n}{projection}.txt"
  plans:   "{version}/{approach}/{strategy}-sf{n}/q{1..9}.json"
  state:   "{version}/{approach}/{strategy}-sf{n}/_state.json"

output_format:
  results: >
    timestamp,query,result,median,mean,peak_memory_kb,[t1;t2;t3;t4;t5]
    the trailing field lists each repetition, with "timeout" for a cancelled run;
    plus a trailing failure_rate line